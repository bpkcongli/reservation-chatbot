name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --project apps/backend --locked --dev
      - run: uv run --project apps/backend ruff check apps/backend
      - run: uv run --project apps/backend ruff format --check apps/backend
      - run: uv run --project apps/backend mypy apps/backend/app
      - run: uv run --project apps/backend pytest apps/backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/frontend lint
      - run: bun run format:check
      - run: bun run --cwd apps/frontend typecheck
      - run: bun run --cwd apps/frontend test
      - run: bunx playwright install --with-deps chromium
      - run: bun run --cwd apps/frontend test:e2e
      - run: bun run --cwd apps/frontend build
